name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with official Buildozer image
        run: |
          docker pull ghcr.io/kivy/buildozer:latest
          docker run --rm --volume "$PWD":/home/user/hostcwd ghcr.io/kivy/buildozer:latest android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
